<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05080a" />
    <title>onsite — 近づくと、ひらく。</title>
    <link rel="icon" href="../icon.svg" />
    <style>
      html, body { margin: 0; height: 100%; background: #05080a; overflow: hidden; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #05080a; outline: none; }
      /* 読み込み画面：アプリ自身の見た目で（他社のロゴは出さない） */
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        color: #e6f4f7; font-family: "Barlow Condensed", "Zen Kaku Gothic New", system-ui, sans-serif; transition: opacity .5s; }
      #boot h1 { margin: 0; font-weight: 300; font-size: 54px; letter-spacing: .32em; padding-left: .32em; }
      #boot p { margin: 0; color: #7fe3ff; letter-spacing: .4em; font-size: 12px; }
      #bar { width: min(62vw, 320px); height: 6px; display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; }
      #bar i { background: rgb(127 227 255 / 14%); }
      #bar i.on { background: #7fe3ff; box-shadow: 0 0 8px #7fe3ff; }
      #msg { font-family: "Share Tech Mono", ui-monospace, monospace; font-size: 11px; color: #7fa3ab; letter-spacing: .12em; }
      #boot.done { opacity: 0; pointer-events: none; }
      #lite { position: absolute; bottom: 36px; color: #7fa3ab; font-size: 12px; letter-spacing: .12em; text-decoration: none; border-bottom: 1px solid rgb(127 227 255 / 30%); padding-bottom: 4px; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300&family=Share+Tech+Mono&display=swap" rel="stylesheet" crossorigin="anonymous" />
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="boot">
      <h1>ONSITE</h1>
      <p>近づくと、ひらく。</p>
      <div id="bar"></div>
      <div id="msg">LOADING FIELD DATA</div>
      <a id="lite" href="/lite">読み込みが重いときは　軽い版で開く →</a>
    </div>
    <script>
      const bar = document.getElementById('bar');
      for (let i = 0; i < 24; i++) bar.appendChild(document.createElement('i'));
      const cells = [...bar.children];
      const setProgress = (p) => cells.forEach((c, i) => c.classList.toggle('on', i < Math.round(p * 24)));

      const buildUrl = 'Build';
      const config = {
        dataUrl: buildUrl + '/{{{ DATA_FILENAME }}}',
        frameworkUrl: buildUrl + '/{{{ FRAMEWORK_FILENAME }}}',
#if USE_THREADS
        workerUrl: buildUrl + '/{{{ WORKER_FILENAME }}}',
#endif
#if USE_WASM
        codeUrl: buildUrl + '/{{{ CODE_FILENAME }}}',
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + '/{{{ SYMBOLS_FILENAME }}}',
#endif
        streamingAssetsUrl: 'StreamingAssets',
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      };

      // ?demo=1 などの指定は、軽い版へもそのまま渡す
      document.getElementById('lite').href = '/lite' + location.search;
      const script = document.createElement('script');
      script.src = buildUrl + '/{{{ LOADER_FILENAME }}}';
      script.onload = () => {
        createUnityInstance(document.getElementById('unity-canvas'), config, setProgress)
          .then(() => {
            const boot = document.getElementById('boot');
            boot.classList.add('done');
            setTimeout(() => boot.remove(), 700);
            startRecording();
          })
          .catch((e) => { document.getElementById('msg').textContent = '読み込みに失敗しました：' + e; });
      };
      document.body.appendChild(script);

      // 紹介動画用：?rec=秒数 で、画面（と効果音）を録画して webm を保存する
      function startRecording() {
        const seconds = Number(new URLSearchParams(location.search).get('rec'));
        if (!seconds || !window.MediaRecorder) return;
        const canvas = document.getElementById('unity-canvas');
        const stream = canvas.captureStream(30);
        if (window.__onsiteAudioStream) window.__onsiteAudioStream.getAudioTracks().forEach((t) => stream.addTrack(t));
        // 提出は MP4 が必須なので、対応していれば MP4 で録る
        const type = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4;codecs=avc1,opus', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'].find((t) => MediaRecorder.isTypeSupported(t));
        const ext = type.startsWith('video/mp4') ? 'mp4' : 'webm';
        const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 10000000 });
        const chunks = [];
        rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
        rec.onstop = () => {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob(chunks, { type: type.split(';')[0] }));
          a.download = 'onsite-demo.' + ext;
          document.body.appendChild(a); a.click();
          document.title = 'onsite — recorded';
        };
        rec.start(1000);
        document.title = 'onsite — recording';
        setTimeout(() => rec.stop(), seconds * 1000);
      }
    </script>
  </body>
</html>
